<svg xmlns="http://www.w3.org/2000/svg" id="aa-worker-anatomy-sheet" viewBox="0 0 48 48" role="img" aria-labelledby="anatomy-title anatomy-desc" shape-rendering="crispEdges">
  <title id="anatomy-title">AA worker base anatomy</title>
