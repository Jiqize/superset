    <g id="base-neck" fill="#c98f68"><path d="M20 24h8v8h-8z"/></g>
    <g id="base-head" fill="#242424"><path d="M12 8h24v16h-4v4H16v-4h-4V8Z"/><path fill="#e2ad82" d="M16 8h16v16H16z"/></g>
    <g id="base-face" fill="#171717"><path d="M18 16h4v4h-4v-4Zm8 0h4v4h-4v-4Zm-4 6h4v2h-4v-2Z"/></g>
