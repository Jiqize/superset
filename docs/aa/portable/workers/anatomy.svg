  <rect width="48" height="48" fill="#b5b4af"/>
  <g id="base-anatomy">
    <g id="base-shadow" fill="#5d5c58"><path d="M8 40h32v4H8z"/></g>
    <g id="base-body" fill="#242424"><path d="M12 28h24v4h4v12H8V32h4v-4Z"/></g>
