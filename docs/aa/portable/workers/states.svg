<svg xmlns="http://www.w3.org/2000/svg" id="aa-worker-states-sheet" viewBox="0 0 288 48" role="img" aria-labelledby="states-title states-desc" shape-rendering="crispEdges">
  <title id="states-title">AA worker activity states</title>
