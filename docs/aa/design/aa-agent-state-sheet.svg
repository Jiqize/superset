<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" shape-rendering="crispEdges">
  <rect width="1120" height="520" fill="#A7A6A1"/>
  <style>
    .ink{fill:#242424}.skin{fill:#C9946F}.shirt{fill:#E2E0D9}.tie{fill:#173267}.hair{fill:#2B211B}.desk{fill:#6D482C}.screen{fill:#202923}.amber{fill:#E0A11B}.red{fill:#9C302B}.blue{fill:#4D78A8}.grey{fill:#777A7E}.paper{fill:#E9E5D8}
    .label{font:700 15px ui-monospace,monospace;fill:#171717;letter-spacing:1px}
    .sub{font:12px ui-monospace,monospace;fill:#454542}
  </style>
  <text x="28" y="34" class="label">AA AGENT STATE SHEET / V0.1 / REFERENCE ONLY</text>
  <text x="28" y="56" class="sub">Composable worker concept: identity + reasoning hair + activity pose + real status signal.</text>

  <!-- IDLE -->
  <g transform="translate(28 88)">
    <rect class="ink" x="40" y="8" width="40" height="8"/><rect class="hair" x="36" y="16" width="48" height="16"/><rect class="skin" x="40" y="28" width="40" height="36"/>
    <rect class="ink" x="48" y="40" width="4" height="4"/><rect class="ink" x="68" y="40" width="4" height="4"/><rect class="ink" x="56" y="52" width="12" height="4"/>
    <rect class="shirt" x="32" y="64" width="56" height="64"/><rect class="tie" x="56" y="68" width="8" height="44"/><rect class="ink" x="28" y="72" width="4" height="52"/><rect class="ink" x="88" y="72" width="4" height="52"/>
    <rect class="ink" x="36" y="128" width="16" height="8"/><rect class="ink" x="68" y="128" width="16" height="8"/>
    <rect class="grey" x="96" y="28" width="12" height="12"/><text x="20" y="166" class="label">IDLE</text>
  </g>

  <!-- THINKING -->
  <g transform="translate(220 88)">
    <rect class="hair" x="36" y="12" width="48" height="20"/><rect class="skin" x="40" y="28" width="40" height="36"/><rect class="ink" x="48" y="40" width="4" height="4"/><rect class="ink" x="68" y="40" width="4" height="4"/><rect class="ink" x="56" y="52" width="12" height="4"/>
    <rect class="shirt" x="32" y="64" width="56" height="64"/><rect class="tie" x="56" y="68" width="8" height="44"/>
    <rect class="skin" x="84" y="72" width="12" height="28"/><rect class="skin" x="76" y="96" width="16" height="12"/><rect class="ink" x="80" y="92" width="12" height="4"/>
    <rect class="ink" x="36" y="128" width="16" height="8"/><rect class="ink" x="68" y="128" width="16" height="8"/>
    <rect class="amber" x="100" y="28" width="12" height="12"/><text x="10" y="166" class="label">THINKING</text>
  </g>

  <!-- WORKING FRAME 1 -->
  <g transform="translate(412 88)">
    <rect class="hair" x="36" y="12" width="48" height="20"/><rect class="skin" x="40" y="28" width="40" height="36"/><rect class="ink" x="48" y="40" width="4" height="4"/><rect class="ink" x="68" y="40" width="4" height="4"/>
    <rect class="shirt" x="24" y="64" width="72" height="52"/><rect class="tie" x="56" y="68" width="8" height="36"/>
    <rect class="desk" x="8" y="116" width="112" height="20"/><rect class="ink" x="64" y="72" width="48" height="40"/><rect class="screen" x="68" y="76" width="40" height="28"/>
    <rect class="skin" x="28" y="104" width="20" height="8"/><rect class="skin" x="48" y="108" width="16" height="8"/>
    <rect class="amber" x="116" y="28" width="12" height="12"/><text x="0" y="166" class="label">WORKING 1</text>
  </g>

  <!-- WORKING FRAME 2 -->
  <g transform="translate(604 88)">
    <rect class="hair" x="36" y="12" width="48" height="20"/><rect class="skin" x="40" y="28" width="40" height="36"/><rect class="ink" x="48" y="40" width="4" height="4"/><rect class="ink" x="68" y="40" width="4" height="4"/>
    <rect class="shirt" x="24" y="64" width="72" height="52"/><rect class="tie" x="56" y="68" width="8" height="36"/>
    <rect class="desk" x="8" y="116" width="112" height="20"/><rect class="ink" x="64" y="72" width="48" height="40"/><rect class="screen" x="68" y="76" width="40" height="28"/>
    <rect class="skin" x="36" y="108" width="20" height="8"/><rect class="skin" x="56" y="104" width="16" height="8"/>
    <rect class="amber" x="116" y="28" width="12" height="12"/><text x="0" y="166" class="label">WORKING 2</text>
  </g>

  <!-- WAITING -->
  <g transform="translate(796 88)">
    <rect class="hair" x="36" y="12" width="48" height="20"/><rect class="skin" x="40" y="28" width="40" height="36"/><rect class="ink" x="48" y="40" width="4" height="4"/><rect class="ink" x="68" y="40" width="4" height="4"/>
    <rect class="shirt" x="32" y="64" width="56" height="64"/><rect class="tie" x="56" y="68" width="8" height="44"/>
    <rect class="paper" x="80" y="76" width="28" height="36"/><rect class="ink" x="84" y="84" width="20" height="4"/><rect class="ink" x="84" y="92" width="16" height="4"/>
    <rect class="skin" x="72" y="88" width="12" height="20"/><rect class="blue" x="112" y="28" width="12" height="12"/><text x="14" y="166" class="label">WAITING</text>
  </g>

  <!-- ERROR -->
  <g transform="translate(972 88)">
    <rect class="hair" x="32" y="16" width="48" height="16"/><rect class="skin" x="36" y="32" width="40" height="36"/><rect class="ink" x="44" y="44" width="4" height="4"/><rect class="ink" x="64" y="44" width="4" height="4"/><rect class="ink" x="48" y="56" width="16" height="4"/>
    <rect class="shirt" x="28" y="68" width="56" height="60"/><rect class="tie" x="52" y="72" width="8" height="40"/>
    <rect class="skin" x="12" y="44" width="20" height="12"/><rect class="skin" x="80" y="44" width="20" height="12"/><rect class="red" x="100" y="28" width="12" height="12"/>
    <rect class="paper" x="4" y="92" width="16" height="20"/><rect class="paper" x="92" y="100" width="16" height="20"/><text x="18" y="166" class="label">ERROR</text>
  </g>

  <text x="28" y="300" class="label">REASONING HAIR MODIFIERS</text>
  <text x="28" y="322" class="sub">Explicit reasoning text stays visible. Hair is only a secondary mnemonic.</text>

  <!-- HAIR LOW -->
  <g transform="translate(44 350)">
    <rect class="skin" x="28" y="24" width="48" height="48"/><rect class="hair" x="24" y="8" width="56" height="24"/><rect class="hair" x="20" y="20" width="8" height="24"/><rect class="hair" x="76" y="20" width="8" height="24"/><text x="18" y="104" class="label">LOW</text>
  </g>
  <!-- HAIR MEDIUM -->
  <g transform="translate(236 350)">
    <rect class="skin" x="28" y="24" width="48" height="48"/><rect class="hair" x="28" y="12" width="48" height="20"/><rect class="hair" x="24" y="20" width="8" height="20"/><rect class="hair" x="72" y="20" width="8" height="20"/><text x="4" y="104" class="label">MEDIUM</text>
  </g>
  <!-- HAIR HIGH -->
  <g transform="translate(444 350)">
    <rect class="skin" x="28" y="24" width="48" height="48"/><rect class="hair" x="36" y="12" width="32" height="12"/><rect class="hair" x="28" y="20" width="12" height="16"/><rect class="hair" x="64" y="20" width="12" height="16"/><text x="18" y="104" class="label">HIGH</text>
  </g>
  <!-- HAIR VERY HIGH -->
  <g transform="translate(636 350)">
    <rect class="skin" x="28" y="24" width="48" height="48"/><rect class="hair" x="28" y="20" width="12" height="12"/><rect class="hair" x="64" y="20" width="12" height="12"/><rect class="hair" x="48" y="12" width="8" height="8"/><text x="0" y="104" class="label">VERY HIGH</text>
  </g>
  <!-- HAIR MAX -->
  <g transform="translate(860 350)">
    <rect class="skin" x="28" y="24" width="48" height="48"/><rect class="hair" x="32" y="16" width="8" height="8"/><rect class="hair" x="64" y="20" width="4" height="4"/><text x="20" y="104" class="label">MAX</text>
  </g>
</svg>
